name: revelationsai
description: RevelationsAI Mobile App
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.6.3

environment:
  sdk: ">=3.1.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  hexcolor: ^3.0.1
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.4
  riverpod_annotation: ^2.3.3
  freezed: ^2.4.6
  json_annotation: ^4.8.1
  http: ^1.2.0
  go_router: ^13.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4
  nanoid: ^1.0.0
  uuid: ^4.3.3
  font_awesome_flutter: ^10.7.0
  flutter_spinkit: ^5.2.0
  share_plus: ^7.2.1
  flutter_dotenv: ^5.1.0
  flutter_timezone: ^1.0.8
  timezone: ^0.9.2
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  package_info_plus: ^5.0.1
  flutter_web_auth_2: ^3.1.1
  flutter_native_splash: ^2.3.10
  purchases_flutter: ^6.18.0
  quiver: ^3.2.1
  another_flushbar: ^1.12.30
  visibility_detector: ^0.4.0+2
  newrelic_mobile: ^1.0.6
  in_app_review: ^2.0.8
  flutter_app_badger: ^1.5.0
  email_validator: ^2.1.17
  image_picker: ^1.0.7
  path: ^1.8.3
  image_cropper: ^5.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  google_mobile_ads: ^4.0.0
  cached_network_image: ^3.3.1
  image_gallery_saver: ^2.0.3
  flutter_markdown_selectionarea: ^0.6.17+1
  freezed_annotation: ^2.4.1
  screenshot: ^2.1.0
  popover: ^0.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.3
  build_runner: ^2.4.8
  custom_lint: ^0.5.11
  riverpod_lint: ^2.1.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0
  isar_generator: ^3.1.0+1
  analyzer: ^5.13.0

flutter_launcher_icons:
  ios: true
  image_path_ios: "assets/icons/ios-icon.png"
  remove_alpha_ios: true

  android: true
  image_path_android: "assets/icons/android-icon.png"
  adaptive_icon_background: "#334155"
  adaptive_icon_foreground: "assets/icons/android-icon.png"

flutter_native_splash:
  image: "assets/icons/splash-icon-dark.png"
  color: "#FFFFFF"
  image_dark: "assets/icons/splash-icon-light.png"
  color_dark: "#020617"

  ios: true

  android: true
  android_12:
    image: "assets/icons/android-12-splash-icon-dark.png"
    color: "#FFFFFF"
    image_dark: "assets/icons/android-12-splash-icon-light.png"
    color_dark: "#020617"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/ios-icon.png
    - assets/icons/android-icon.png
    - assets/icons/splash-icon-light.png
    - assets/icons/splash-icon-dark.png
    - assets/icons/android-12-splash-icon-light.png
    - assets/icons/android-12-splash-icon-dark.png
    - assets/logo/logo-light.png
    - assets/logo/logo-dark.png
    - assets/logo/plus-logo-light.png
    - assets/logo/plus-logo-dark.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/dm_sans/DMSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/dm_sans/DMSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/dm_sans/DMSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/dm_sans/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/dm_sans/DMSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/dm_sans/DMSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Black.ttf
          weight: 900
        - asset: assets/fonts/dm_sans/DMSans-BlackItalic.ttf
          weight: 900
          style: italic
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
